<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play · Carlin Game Hub</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="./"><span class="brand-mark">▶</span><span>Carlin <b>Game Hub</b></span></a><a class="play-button" href="./">← Back</a></header><main><div id="gameHeader" class="toolbar"></div><div class="game-actions"><button id="fullscreenButton" class="play-button fullscreen-button" type="button">⛶ Fullscreen</button></div><div class="frame-wrap" id="frameWrap"><iframe id="gameFrame" title="Game" allow="fullscreen; gamepad" allowfullscreen></iframe></div></main><style>.frame-wrap{background:#000;border-radius:15px;overflow:hidden;border:1px solid var(--border)}iframe{display:block;width:100%;height:min(70vh,650px);border:0}.toolbar{padding-top:35px}.game-actions{display:flex;justify-content:flex-end;margin:-10px 0 12px}.fullscreen-button{border:0;cursor:pointer;font:inherit}.frame-wrap:fullscreen{border-radius:0;width:100vw;height:100vh}.frame-wrap:fullscreen iframe{height:100vh}.frame-wrap:-webkit-full-screen{border-radius:0;width:100vw;height:100vh}.frame-wrap:-webkit-full-screen iframe{height:100vh}</style><script src="games.js"></script><script>const id=Number(new URLSearchParams(location.search).get('game'));const game=games[id];if(!game)location.href='./';else{document.title=game.title+' · Carlin Game Hub';document.querySelector('#gameHeader').innerHTML='<div><p class="eyebrow">NOW PLAYING · '+game.category.toUpperCase()+'</p><h2>'+game.title+'</h2><p style="color:var(--muted)">'+game.description+'</p></div>';const frame=document.querySelector('#gameFrame');frame.src=game.iframeUrl;frame.title=game.title;const wrap=document.querySelector('#frameWrap'),button=document.querySelector('#fullscreenButton');button.addEventListener('click',async()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();else await document.webkitExitFullscreen()}else if(wrap.requestFullscreen)await wrap.requestFullscreen();else if(wrap.webkitRequestFullscreen)await wrap.webkitRequestFullscreen()}catch(error){console.error('Fullscreen unavailable:',error)}});function updateButton(){button.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'⛶ Exit fullscreen':'⛶ Fullscreen'}document.addEventListener('fullscreenchange',updateButton);document.addEventListener('webkitfullscreenchange',updateButton)}</script></body></html>
