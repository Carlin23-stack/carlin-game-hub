<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#24132c;color:#fff;font:18px system-ui;text-align:center;padding:18px}#grid{display:grid;grid-template-columns:repeat(4,70px);gap:10px;justify-content:center;margin:28px auto}.card{height:70px;border:0;border-radius:10px;background:#773f8e;color:transparent;font-size:30px;cursor:pointer}.card.show{background:#e05c91;color:#fff}.card.done{background:#65e7c5;color:#16252a}</style></head><body><div>Find all pairs · <span id="moves">0</span> moves</div><div id="grid"></div><script>const icons=['◆','◆','★','★','☀','☀','♥','♥'].sort(()=>Math.random()-.5),grid=document.querySelector('#grid');let first=null,lock=0,moves=0;icons.forEach(v=>{let b=document.createElement('button');b.className='card';b.textContent=v;b.onclick=()=>{if(lock||b.classList.contains('done')||b===first)return;b.classList.add('show');if(!first){first=b;return}moves++;document.querySelector('#moves').textContent=moves;if(first.textContent===b.textContent){first.classList.add('done');b.classList.add('done');first=null}else{lock=1;setTimeout(()=>{first.classList.remove('show');b.classList.remove('show');first=null;lock=0},650)}};grid.append(b)})</script></body></html>
