<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#111;color:#fff;font:16px system-ui;text-align:center}canvas{display:block;width:min(100%,600px);height:auto;margin:auto;background:#191530}p{color:#aaa}</style></head><body><p>Use ← → or A/D to move. Dodge the blocks!</p><canvas id="c" width="600" height="500"></canvas><script>const c=document.querySelector('canvas'),x=c.getContext('2d');let p={x:280,y:450,w:40,h:20},blocks=[],keys={},score=0,over=0;addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function loop(){x.clearRect(0,0,600,500);x.fillStyle='#211d42';x.fillRect(0,0,600,500);if(!over){if(keys.arrowleft||keys.a)p.x-=6;if(keys.arrowright||keys.d)p.x+=6;p.x=Math.max(0,Math.min(560,p.x));if(Math.random()<.035)blocks.push({x:Math.random()*570,y:-20,w:20+Math.random()*35,h:20,s:2+score/400});blocks.forEach(b=>b.y+=b.s);blocks=blocks.filter(b=>b.y<520);if(blocks.some(b=>p.x<b.x+b.w&&p.x+p.w>b.x&&p.y<b.y+b.h&&p.y+p.h>b.y))over=1;score++}x.fillStyle='#65e7c5';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='#ff668f';blocks.forEach(b=>x.fillRect(b.x,b.y,b.w,b.h));x.fillStyle='#fff';x.fillText('Score: '+Math.floor(score/10),15,25);if(over){x.font='bold 32px system-ui';x.fillText('Game over',220,240);x.font='16px system-ui';x.fillText('Refresh to try again',225,275)}requestAnimationFrame(loop)}loop();</script></body></html>
